<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黑木股份有限公司 - 企業客戶專屬平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .kuroki-logo { font-size: 1.5rem; font-weight: 900; color: #005A9E; letter-spacing: 2px; }
    .d-none { display: none !important; }
    .dashboard-card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); border-radius: 0.5rem; }
    .table th { background-color: #005A9E; color: white; }
    .status-expired { color: #dc3545; font-weight: bold; font-size: 0.9em; }
    .status-valid { color: #198754; font-weight: bold; font-size: 0.9em; }
  </style>
</head>
<body>

  <!-- 登入驗證區 -->
  <div id="loginSection" class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px; border-radius: 1rem;">
      <div class="text-center mb-4">
        <div class="kuroki-logo">KUROKI 黑木</div>
        <h5 class="mt-2 text-muted">企業客戶專屬登入 (OTP)</h5>
      </div>

      <div id="step1-email">
        <div class="mb-3">
          <label class="form-label">請輸入企業登記信箱</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@company.com" required>
        </div>
        <button class="btn btn-primary w-100" style="background-color: #005A9E; border: none;" onclick="sendOTP()">發送動態驗證碼</button>
      </div>

      <div id="step2-otp" class="d-none">
        <div class="alert alert-success small">驗證碼已發送至您的信箱，請查收 (含垃圾郵件匣)。</div>
        <div class="mb-3">
          <label class="form-label">6 位數驗證碼</label>
          <input type="text" id="loginOtp" class="form-control text-center" placeholder="000000" maxlength="6" style="font-size: 1.5rem; letter-spacing: 5px;">
        </div>
        <button class="btn btn-success w-100" onclick="verifyOTP()">驗證並登入</button>
        <button class="btn btn-link w-100 mt-2 text-muted text-decoration-none small" onclick="location.reload()">重新輸入信箱</button>
      </div>
      
      <div id="loginMsg" class="mt-3 text-danger text-center small"></div>
    </div>
  </div>

  <!-- 登入後的專屬儀表板 -->
  <div id="dashboardSection" class="d-none">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #005A9E;">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">KUROKI 客戶專區</a>
        <div class="d-flex text-white align-items-center">
          <span id="userGreeting" class="me-3">載入中...</span>
          <button class="btn btn-outline-light btn-sm" onclick="logout()">登出</button>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
        <li class="nav-item">
          <button class="nav-link active fw-bold" id="history-tab" data-bs-toggle="tab" data-bs-target="#history" type="button">歷史購買紀錄與價格效期</button>
        </li>
        <li class="nav-item">
          <button class="nav-link fw-bold" id="newquote-tab" data-bs-toggle="tab" data-bs-target="#newquote" type="button">新產品詢價 (自訂需求)</button>
        </li>
      </ul>

      <div class="tab-content" id="myTabContent">
        <!-- 分頁一：歷史購買紀錄 (自動依日期排序並判斷 90 天效期) -->
        <div class="tab-pane fade show active" id="history" role="tabpanel">
          <div class="card dashboard-card">
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead>
                    <tr>
                      <th>出貨單號 (項次)</th>
                      <th>產品編號</th>
                      <th>產品名稱</th>
                      <th>最近購買日</th>
                      <th>最後單價</th>
                      <th>價格狀態 (3個月有效)</th>
                    </tr>
                  </thead>
                  <tbody id="historyTableBody">
                    <tr><td colspan="6" class="text-center py-4 text-muted">正在載入您的購買紀錄...</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <!-- 分頁二：新產品詢價 -->
        <div class="tab-pane fade" id="newquote" role="tabpanel">
          <div class="card dashboard-card">
            <div class="card-body">
              <h5 class="card-title text-primary mb-3">提出新產品詢價需求</h5>
              <form id="newQuoteForm" onsubmit="submitNewQuote(event)">
                <div class="mb-3">
                  <label class="form-label">產品大類別</label>
                  <select id="qCategory" class="form-select" required>
                    <option value="包膠">包膠</option>
                    <option value="刮刀">刮刀</option>
                    <option value="全膠">全膠</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">自訂需求說明</label>
                  <textarea id="qRequirement" class="form-control" rows="4" placeholder="請描述您的特殊材質、應用場景或預期尺寸..." required></textarea>
                </div>
                <div class="mb-3 p-3 bg-light border rounded">
                  <label class="form-label d-block fw-bold">圖面提供方式</label>
                  <div class="form-check form-check-inline mb-2">
                    <input class="form-check-input" type="radio" name="drawOption" id="drawUpload" checked onchange="document.getElementById('uploadDiv').style.display='block'">
                    <label class="form-check-label" for="drawUpload">自行上傳圖面 (PDF/CAD)</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="drawOption" id="drawKuroki" onchange="document.getElementById('uploadDiv').style.display='none'">
                    <label class="form-check-label" for="drawKuroki">需由黑木代為出圖</label>
                  </div>
                  <div id="uploadDiv" class="mt-2">
                    <input type="file" id="qFile" class="form-control">
                  </div>
                </div>
                <button type="submit" id="btnSubmitQuote" class="btn btn-primary px-4" style="background-color: #005A9E; border: none;">送出詢價需求</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ----------------------------------------------------
    // 請填入您的 Supabase 專案設定
    // ----------------------------------------------------
    const SUPABASE_URL = 'https://souwlzmdujwqvkrmtdcn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4HpIK4hlE0dbciKoUjuq0g_vydabgwQ';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUserCompanyId = null;

    // 1. 發送 OTP 驗證碼
    async function sendOTP() {
      const email = document.getElementById('loginEmail').value.trim();
      if (!email || !email.includes('@')) {
        document.getElementById('loginMsg').innerText = "請輸入有效的企業信箱";
        return;
      }

      const { error } = await supabaseClient.auth.signInWithOtp({ email });
      if (error) {
        document.getElementById('loginMsg').innerText = "發送失敗: " + error.message;
        return;
      }

      document.getElementById('step1-email').classList.add('d-none');
      document.getElementById('step2-otp').classList.remove('d-none');
      document.getElementById('loginMsg').innerText = "";
    }

    // 2. 驗證 OTP 並登入
    async function verifyOTP() {
      const email = document.getElementById('loginEmail').value.trim();
      const token = document.getElementById('loginOtp').value.trim();

      if (token.length !== 6) {
        document.getElementById('loginMsg').innerText = "請輸入完整 6 位數驗證碼";
        return;
      }

      const { data, error } = await supabaseClient.auth.verifyOtp({ email, token, type: 'email' });
      if (error) {
        document.getElementById('loginMsg').innerText = "驗證失敗: " + error.message;
        return;
      }

      checkUserSession();
    }

    // 3. 檢查登入狀態並載入客戶專屬購買紀錄
    async function checkUserSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return;

      const user = session.user;
      document.getElementById('loginSection').classList.add('d-none');
      document.getElementById('dashboardSection').classList.remove('d-none');
      document.getElementById('userGreeting').innerText = `登入帳號：${user.email}`;

      // 取得該信箱對應的 company_id 與客戶資料
      const { data: customerData } = await supabaseClient
        .from('customers')
        .select('company_id, companies(name)')
        .eq('id', user.id)
        .single();

      if (customerData) {
        currentUserCompanyId = customerData.company_id;
        document.getElementById('userGreeting').innerText = `公司：${customerData.companies.name}`;
        loadCustomerTransactions(currentUserCompanyId);
      } else {
        document.getElementById('historyTableBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger">找不到對應的公司授權資料，請聯繫業務員開通帳號。</td></tr>`;
      }
    }

    // 4. 動態撈取歷史購買紀錄 (自動套用資料庫 90 天效期 View)
    async function loadCustomerTransactions(companyId) {
      const { data, error } = await supabaseClient
        .from('vw_customer_transactions')
        .select('*')
        .eq('company_id', companyId)
        .order('last_purchase_date', { ascending: false }); // 日期由近到遠 (需求 10-1)

      const tbody = document.getElementById('historyTableBody');
      if (error || !data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">目前查無歷史購買紀錄</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      data.forEach(row => {
        const isExpired = row.price_status.includes('失效');
        const statusHtml = isExpired 
          ? `<span class="status-expired">${row.price_status}</span>` 
          : `<span class="status-valid">價格有效 (3個月內)</span>`;

        tbody.innerHTML += `
          <tr>
            <td>${row.shipment_no} (${row.item_seq})</td>
            <td><code>${row.item_code}</code></td>
            <td>${row.product_name}</td>
            <td>${row.last_purchase_date}</td>
            <td>$ ${row.last_price ? row.last_price.toLocaleString() : '0'}</td>
            <td>${statusHtml}</td>
          </tr>
        `;
      });
    }

    // 5. 舊客戶提交新產品詢價需求
    async function submitNewQuote(event) {
      event.preventDefault();
      const category = document.getElementById('qCategory').value;
      const requirement = document.getElementById('qRequirement').value;
      const needsDrawing = document.getElementById('drawKuroki').checked;
      const fileInput = document.getElementById('qFile');
      const btn = document.getElementById('btnSubmitQuote');

      btn.disabled = true;
      btn.innerText = "傳送中...";

      let fileUrl = null;
      if (!needsDrawing && fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const filePath = `old_quotes/${Date.now()}_${file.name}`;
        const { data: uploadData, error: uploadErr } = await supabaseClient.storage
          .from('quote-drawings')
          .upload(filePath, file);
        if (!uploadErr) fileUrl = uploadData.path;
      }

      const { data: { session } } = await supabaseClient.auth.getSession();
      const { error } = await supabaseClient.from('quotes').insert([
        {
          company_id: currentUserCompanyId,
          customer_id: session.user.id,
          custom_requirement: `【舊客戶新詢價】\n【大類】${category}\n【說明】${requirement}`,
          file_url: fileUrl,
          needs_drawing: needsDrawing,
          status: '未處理'
        }
      ]);

      if (error) {
        alert("送出失敗: " + error.message);
        btn.disabled = false;
        btn.innerText = "送出詢價需求";
      } else {
        alert("詢價需求已成功送出！業務將盡快為您處理。");
        document.getElementById('newQuoteForm').reset();
        btn.disabled = false;
        btn.innerText = "送出詢價需求";
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    // 網頁載入時自動檢查登入狀態
    checkUserSession();
  </script>
</body>
</html>
