<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黑木股份有限公司 - 新產品詢價表單（免登入）</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); margin-bottom: 1.5rem; border-radius: 0.5rem; }
    .card-header { background-color: #ffffff; border-bottom: 2px solid #005A9E; font-weight: bold; color: #005A9E; border-radius: 0.5rem 0.5rem 0 0 !important; }
    .form-label { font-weight: 500; color: #495057; }
    .kuroki-header { text-align: center; padding: 2rem 0 1rem; }
    .kuroki-logo { font-size: 1.5rem; font-weight: 900; color: #005A9E; letter-spacing: 2px; }
    .required-asterisk { color: red; margin-left: 3px; }
    .is-invalid { border-color: #dc3545; }
  </style>
</head>
<body>
  <div class="container py-3" style="max-width: 800px;">
    <div class="kuroki-header">
      <div class="kuroki-logo mb-2">KUROKI 黑木股份有限公司</div>
      <h4>新產品詢價表單（免登入）</h4>
      <p class="text-muted">請填寫您的產品需求並留下聯絡方式，我們的業務團隊將盡快為您提供專屬報價。</p>
    </div>

    <form id="quoteForm" onsubmit="handleFormSubmit(event)">
      <!-- 卡片一：客戶基本資訊 -->
      <div class="card">
        <div class="card-header">基本聯絡資訊</div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">公司全名<span class="required-asterisk">*</span></label>
              <input type="text" name="companyName" class="form-control" required placeholder="例：王小明實業有限公司">
            </div>
            <div class="col-md-6">
              <label class="form-label">公司統編</label>
              <input type="text" name="vatNumber" class="form-control" pattern="\d{8}" placeholder="8碼數字 (選填)">
            </div>
            <div class="col-md-4">
              <label class="form-label">聯絡窗口人員<span class="required-asterisk">*</span></label>
              <input type="text" name="contactName" class="form-control" required placeholder="姓名與稱呼">
            </div>
            <div class="col-md-4">
              <label class="form-label">聯絡電話<span class="required-asterisk">*</span></label>
              <input type="tel" name="contactPhone" class="form-control" required placeholder="例：02-12345678" onblur="validatePhone(this)">
            </div>
            <div class="col-md-4">
              <label class="form-label">聯絡信箱<span class="required-asterisk">*</span></label>
              <input type="email" name="contactEmail" class="form-control" required placeholder="name@company.com" onblur="validateEmail(this)">
            </div>
          </div>
        </div>
      </div>

      <!-- 卡片二：產品規格與需求說明 -->
      <div class="card">
        <div class="card-header">產品需求</div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">產品大類別<span class="required-asterisk">*</span></label>
            <select name="productCategory" class="form-select" required>
              <option value="" disabled selected>請選擇產品類別...</option>
              <option value="包膠">包膠</option>
              <option value="刮刀">刮刀</option>
              <option value="全膠">全膠</option>
              <option value="其他">其他 / 不確定</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">需求說明<span class="required-asterisk">*</span></label>
            <textarea name="customRequirement" class="form-control" rows="4" required placeholder="請描述您的應用場景、材質需求或預期尺寸..."></textarea>
          </div>
        </div>
      </div>

      <!-- 卡片三：圖面提供與驗證 -->
      <div class="card">
        <div class="card-header">圖面提供與驗證</div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label d-block">圖面提供方式<span class="required-asterisk">*</span></label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="drawingOption" id="optionUpload" value="upload" checked onchange="toggleDrawingUpload()">
              <label class="form-check-label" for="optionUpload">自行上傳圖面 (支援 PDF, CAD, JPG)</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="drawingOption" id="optionKuroki" value="kuroki_draw" onchange="toggleDrawingUpload()">
              <label class="form-check-label" for="optionKuroki">需由黑木代為出圖</label>
            </div>
          </div>

          <div id="uploadSection" class="mb-4 p-3 border rounded bg-light">
            <label class="form-label">請選擇要上傳的圖面檔案</label>
            <input type="file" id="fileUpload" name="fileUpload" class="form-control" accept=".pdf,.jpg,.jpeg,.png,.dwg,.dxf">
          </div>

          <!-- 正式防機器人驗證 (請填入真實 Sitekey) -->
          <div class="mb-3 d-flex justify-content-center">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAFnsOFT_ZLnUP4Ha" data-callback="onTurnstileSuccess"></div>
          </div>

          <div id="submitMsg" class="mt-3"></div>

          <div class="d-grid gap-2">
            <button type="submit" id="btnSubmit" class="btn btn-primary btn-lg" disabled style="background-color: #005A9E; border: none;">
              請先完成防機器人驗證
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <script>
    function toggleDrawingUpload() {
      const isUpload = document.getElementById('optionUpload').checked;
      const uploadSection = document.getElementById('uploadSection');
      const fileInput = document.getElementById('fileUpload');
      if (isUpload) {
        uploadSection.style.display = 'block';
      } else {
        uploadSection.style.display = 'none';
        fileInput.value = ''; 
      }
    }

    function validateEmail(input) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      input.classList.toggle('is-invalid', input.value && !re.test(input.value));
    }

    function validatePhone(input) {
      input.classList.toggle('is-invalid', input.value.trim().length < 5);
    }

    function onTurnstileSuccess(token) {
      const btn = document.getElementById('btnSubmit');
      btn.disabled = false;
      btn.innerText = "送出詢價";
    }

    async function handleFormSubmit(event) {
      event.preventDefault();
      const form = event.target;
      
      if (form.querySelectorAll('.is-invalid').length > 0) {
         document.getElementById('submitMsg').innerHTML = "<div class='alert alert-danger'>請修正紅色框線標示的錯誤欄位！</div>";
         return;
      }

      const isUpload = document.getElementById('optionUpload').checked;
      const fileInput = document.getElementById('fileUpload');
      if (isUpload && fileInput.files.length === 0) {
         document.getElementById('submitMsg').innerHTML = "<div class='alert alert-warning'>請夾帶檔案！或勾選「需由黑木代為出圖」。</div>";
         return;
      }

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 資料傳送中...`;
      document.getElementById('submitMsg').innerHTML = "";

      const formData = new FormData(form);

      try {
        // 連線至正式 Supabase 後端 (加入您的 Anon Key 放行)
        const response = await fetch('https://souwlzmdujwqvkrmtdcn.supabase.co/functions/v1/create_quote', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer sb_publishable_4HpIK4hlE0dbciKoUjuq0g_vydabgwQ'
          },
          body: formData
        });
        
        if (!response.ok) {
           const errorData = await response.json();
           throw new Error(errorData.error || "傳輸失敗");
        }
        
        document.getElementById('quoteForm').innerHTML = `
          <div class="text-center p-5 bg-white rounded shadow-sm border">
            <h1 class="display-1 text-success mb-3">✓</h1>
            <h3 class="mb-3">您的詢價已成功送出！</h3>
            <p class="text-muted">系統已將您的需求轉交業務單位，<br>我們將盡快與您聯繫並提供報價。</p>
            <button class="btn btn-outline-primary mt-3" onclick="location.reload()">填寫下一筆詢價</button>
          </div>
        `;
      } catch (error) {
        btn.disabled = false;
        btn.innerText = "重新送出";
        document.getElementById('submitMsg').innerHTML = `<div class='alert alert-danger'>網路異常或檔案上傳失敗，請稍後再試。(${error.message})</div>`;
      }
    }
  </script>
</body>
</html>
